name: Release（构建并推送镜像到 GHCR）

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送镜像（tag + latest）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # 注意：镜像路径为 ghcr.io/<owner>/personal-workbench，与 docker/docker-compose.prod.yml
          # 的 image 字段严格一致（GHCR_OWNER=<owner>）。切勿写成 ${{ github.repository }}，
          # 那会得到 <owner>/<repo>/personal-workbench 两级路径，与 compose 拉取地址不符。
          tags: |
            ghcr.io/${{ github.repository_owner }}/personal-workbench:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/personal-workbench:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
