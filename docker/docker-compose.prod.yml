# 纯镜像拉取部署（无需源码构建）：
#   1) 先在 .env 中提供 POSTGRES_PASSWORD / AUTH_SECRET / APP_URL
#   2) GHCR_OWNER 设为镜像仓库所有者（小写），如 export GHCR_OWNER=fangjiang7531
#   3) docker login ghcr.io 后：docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pwb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
      POSTGRES_DB: personal_workbench
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwb -d personal_workbench"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/${GHCR_OWNER:-local}/personal-workbench:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pwb:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/personal_workbench
      AUTH_SECRET: ${AUTH_SECRET:?请在环境或 .env 中提供至少 32 字符的 AUTH_SECRET}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_FROM: ${MAIL_FROM:-no-reply@workbench.local}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /app/.storage
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/.storage

volumes:
  pgdata:
  storage:
