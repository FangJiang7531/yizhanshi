<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>连接失败</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d1026;
    color: #e9ecff;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    text-align: center;
  }
  .box { padding: 32px; }
  .ring {
    width: 72px; height: 72px; margin: 0 auto 18px;
    border-radius: 50%;
    border: 6px solid transparent;
    border-top-color: #7d8cff; border-bottom-color: #9d8cff;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; color: #aab2e0; margin: 0 0 22px; line-height: 1.7; }
  button {
    border: 0; border-radius: 999px; padding: 11px 34px;
    background: linear-gradient(135deg, #5152e8, #6d5cff);
    color: #fff; font-size: 15px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="ring" aria-hidden></div>
    <h1>无法连接到工作台</h1>
    <p>请检查网络连接后重试。<br/>如果持续失败，可能是服务器正在维护。</p>
    <button onclick="location.href='https://kcforge.cn'">重新连接</button>
  </div>
</body>
</html>
